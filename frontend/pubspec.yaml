name: safe360
description: "Safe360 - App de seguridad ciudadana"
publish_to: 'none'
version: 0.1.0

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  http: ^1.2.0
  shared_preferences: ^2.2.3
  google_sign_in: ^6.2.1
  flutter_contacts: ^1.1.9+1
  permission_handler: ^11.3.1
  mapbox_maps_flutter: ^2.4.0
  geolocator: ^13.0.1
  speech_to_text: ^7.0.0
  image_picker: ^1.1.2
  supabase_flutter: ^2.5.6
  
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/chaty/chaty_neutral.png
    - assets/chaty/chaty_escuchando.png
    - assets/chaty/chaty_procesando.png
    - assets/chaty/chaty_emergencia.png
    - assets/chaty/chaty_feliz.png