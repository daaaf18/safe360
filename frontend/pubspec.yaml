name: safe360
description: "Safe360 - App de seguridad ciudadana"
publish_to: 'none'
version: 0.1.0

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  http: ^1.2.0
  shared_preferences: ^2.2.3
  google_sign_in: ^6.2.1
  flutter_contacts: ^2.3.1
  permission_handler: ^11.3.1
  mapbox_maps_flutter: ^2.29.1
  geolocator: ^13.0.1
  speech_to_text: 7.5.0-beta.1
  image_picker: ^1.1.2
  supabase_flutter: ^2.5.6
  url_launcher: ^6.3.1
  google_fonts: ^6.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.14.3

flutter:
  uses-material-design: true
  assets:
    - assets/chaty/chaty_neutral.png
    - assets/chaty/chaty_escuchando.png
    - assets/chaty/chaty_procesando.png
    - assets/chaty/chaty_emergencia.png
    - assets/chaty/chaty_feliz.png

# Genera los íconos de la app (mipmaps de Android, incl. adaptive icon) a
# partir de un solo PNG fuente. Correr con: dart run flutter_launcher_icons
flutter_launcher_icons:
  android: true
  image_path: "assets/icon/icon.png"
  adaptive_icon_background: "#0B1620"
  adaptive_icon_foreground: "assets/icon/icon.png"